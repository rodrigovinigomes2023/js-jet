// (19/11) PRÉVIA do AH-2 Sabre (Mi-35M da FAB, 2010–2022) p/ o modo helicóptero. Frente = +x, ~18,5 m, rotor de 17 m.
const mats={},geos={};
function M(cor,r=0.8){return mats[cor+'/'+r]||(mats[cor+'/'+r]=new THREE.MeshStandardMaterial({color:new THREE.Color(cor).convertSRGBToLinear(),roughness:r}));}
function G(k,f){return geos[k]||(geos[k]=f());}
function box(w,h,d,mat,x,y,z,pai){const m=new THREE.Mesh(G('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),mat);m.position.set(x,y,z);pai.add(m);return m;}
function esf(r,mat,x,y,z,pai,sx=1,sy=1,sz=1){const m=new THREE.Mesh(G('s'+r,()=>new THREE.SphereGeometry(r,14,10)),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);pai.add(m);return m;}
function cil(rt,rb,h,mat,x,y,z,pai,seg=10){const m=new THREE.Mesh(G('c'+rt+','+rb+','+h+','+seg,()=>new THREE.CylinderGeometry(rt,rb,h,seg)),mat);m.position.set(x,y,z);pai.add(m);return m;}

// camuflagem: ruído 3D na posição do objeto mistura 3 cores (mesma ideia do KC-390)
const CAMO_INV={value:new THREE.Matrix4()};   // inversa da matriz do helicóptero, atualizada a cada quadro
function matCamo(c1,c2,c3,esc=0.3){const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.75});
  m.onBeforeCompile=s=>{s.uniforms.cA={value:new THREE.Color(c1).convertSRGBToLinear()};s.uniforms.cB={value:new THREE.Color(c2).convertSRGBToLinear()};s.uniforms.cC={value:new THREE.Color(c3).convertSRGBToLinear()};s.uniforms.cG={value:new THREE.Color('#8f979a').convertSRGBToLinear()};
    s.uniforms.uInv=CAMO_INV;s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOP;uniform mat4 uInv;').replace('#include <begin_vertex>','#include <begin_vertex>\nvOP=(uInv*modelMatrix*vec4(position,1.0)).xyz;');
    s.fragmentShader=s.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vOP;uniform vec3 cA,cB,cC,cG;
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}`)
     .replace('vec4 diffuseColor = vec4( diffuse, opacity );',`vec3 q=vOP*${esc.toFixed(3)};float a=n3(q)+0.5*n3(q*2.1+7.3),b=n3(q+vec3(31.,7.,13.))+0.5*n3(q*2.3+3.1);
 vec3 cc=cA;if(a>0.8)cc=cB;if(b>0.86)cc=cC;if(vOP.y<1.15&&vOP.x>-3.5)cc=cG;vec4 diffuseColor=vec4(cc,opacity);`);};
  return m;}

// ---------- AH-2 Sabre
function criarSabre(pint){const g=new THREE.Group(),cor=pint.camo?matCamo(...pint.camo):M(pint.cor,0.75),bar=M('#c9ccc4',0.6),pre=M('#24282b',0.6),
    vid=new THREE.MeshStandardMaterial({color:0x5d7a8c,roughness:0.05,metalness:0.5,transparent:true,opacity:0.8}),mol=M('#2e3430',0.6),borr=M('#151515',0.9);
  // fuselagem: perfil lateral extrudado com borda arredondada (cabine dos 2 tripulantes em degrau + compartimento de tropa)
  const s=new THREE.Shape();s.moveTo(7.5,1.2);s.quadraticCurveTo(7.4,0.8,6.9,0.75);s.lineTo(-3,0.75);s.quadraticCurveTo(-4.6,0.95,-5.6,2.3);s.lineTo(-5.6,3.15);
  s.lineTo(-3,3.4);s.lineTo(3.2,3.4);s.lineTo(3.55,2.3);s.lineTo(5.45,2.25);s.lineTo(5.7,1.6);s.lineTo(7.2,1.55);s.quadraticCurveTo(7.55,1.45,7.5,1.2);

  const fus=new THREE.Mesh(ge,cor);g.add(fus);

  esf(1,vid,6.45,1.62,0,g,1.25,0.82,0.78);esf(1,vid,4.5,2.32,0,g,1.2,0.9,0.82);
  for(const [x,y,h] of[[5.75,1.95,1.1],[7.05,1.75,0.7],[3.75,2.75,1.2],[5.2,2.6,0.9]])box(0.09,h,1.7,mol,x,y,0,g);
  box(2.4,0.08,0.09,mol,6.45,2.42,0,g);box(2.3,0.08,0.09,mol,4.5,3.2,0,g);

  g.userData.torre=tor;const pit=cil(0.035,0.035,1.6,bar,8.2,1.25,-0.35,g,5);pit.rotation.z=Math.PI/2;esf(0.2,pre,7.35,0.75,-0.55,g);   // pitot + sensor
  // compartimento de tropa: janelas e porta dupla (cima abre p/ cima, baixo vira escada) dos dois lados
  const portas=[];
  for(const z of[-1,1]){const zz=z*1.09;for(const x of[-2.2,-1.3,-0.4])box(0.42,0.42,0.04,vid,x,2.35,zz,g);
    box(1.55,2.05,0.03,M('#0e1114',0.9),1.75,1.8,zz,g);   // vão da porta (escuro)
    const pc=new THREE.Group();pc.position.set(1.75,2.8,zz+z*0.03);g.add(pc);const a=box(1.5,1.0,0.06,cor,0,-0.5,0,pc);box(0.6,0.4,0.03,vid,0,-0.45,z*0.04,pc);
    const pb=new THREE.Group();pb.position.set(1.75,0.8,zz+z*0.03);g.add(pb);box(1.5,1.0,0.06,cor,0,0.5,0,pb);for(let i=0;i<3;i++)box(1.2,0.05,0.08,pre,0,0.25+i*0.28,z*0.05,pb);
    portas.push({pc,pb,z});}
  // motores em cima: naceles com filtros de areia na frente, escapes virados p/ fora
  box(5,0.9,2.0,cor,0.1,3.75,0,g);
  for(const z of[-1,1]){const n=cil(0.68,0.66,4.6,cor,0.4,4.0,z*0.75,g,14);n.rotation.z=Math.PI/2;esf(0.85,M('#3d4734',0.6),3.0,4.05,z*0.82,g,1.05,1,1);   // filtros de areia (domos)
    cil(0.42,0.42,0.12,pre,-1.6,4.0,z*1.38,g,14).rotation.x=Math.PI/2;}   // escape redondo na lateral
  box(2.4,0.75,1.6,cor,-0.3,4.55,0,g);cil(0.22,0.26,0.8,pre,-0.1,5.15,0,g,8);
  // rotor principal de 5 pás
  const rotor=new THREE.Group();rotor.position.set(-0.1,5.55,0);g.add(rotor);esf(0.45,pre,0,0,0,rotor);
  const pa=new THREE.MeshStandardMaterial({color:0x1d2124,roughness:0.6});
  for(let i=0;i<5;i++){const b=new THREE.Mesh(G('pa5',()=>new THREE.BoxGeometry(8.4,0.09,0.55)),pa);b.position.x=4.4;b.rotation.z=-0.02;const h=new THREE.Group();h.rotation.y=i*Math.PI*2/5;h.add(b);rotor.add(h);}
  const disco=new THREE.Mesh(new THREE.CircleGeometry(8.6,40),new THREE.MeshBasicMaterial({color:0x222222,transparent:true,opacity:0.1,depthWrite:false,side:THREE.DoubleSide}));disco.rotation.x=-Math.PI/2;disco.visible=false;rotor.add(disco);

  for(const z of[-1,1]){const w=new THREE.Group();w.position.set(-0.6,2.55,z*1.05);w.rotation.x=z*0.22;g.add(w);
    box(2.1,0.18,3.7,cor,0,0,z*1.85,w);box(1.6,1.0,0.1,cor,0,-0.25,z*3.7,w);
    for(const k of[1.15,2.55]){box(1.0,0.45,0.12,pre,0.1,-0.32,z*k,w);const p=cil(0.36,0.36,2.3,mol,0.2,-0.85,z*k,w,14);p.rotation.z=Math.PI/2;
      const fr=new THREE.Mesh(G('frB8',()=>new THREE.CircleGeometry(0.34,14)),M('#15181a',0.9));fr.position.set(1.36,-0.85,z*k);fr.rotation.y=Math.PI/2;w.add(fr);}   // casulo de 20 foguetes
    for(const y of[-0.55,0.2])for(const dz of[0,0.24]){const t=cil(0.1,0.1,1.9,M('#6d7564',0.7),0.25,y,z*(3.85+dz),w,6);t.rotation.z=Math.PI/2;}}
  // cone de cauda, estabilizador, deriva inclinada e rotor de cauda de 3 pás do lado esquerdo
  const cone=cil(0.36,0.78,6.4,cor,-8.2,3.05,0,g,12);cone.rotation.z=Math.PI/2+0.06;
  box(1.2,0.12,3.8,cor,-9.8,2.95,0,g);const fin=box(1.9,3.4,0.26,cor,-11.4,4.6,0,g);fin.rotation.z=-0.45;
  const cauda=new THREE.Group();cauda.position.set(-12.0,5.6,-0.4);g.add(cauda);esf(0.18,pre,0,0,0,cauda);
  for(let i=0;i<3;i++){const b=new THREE.Mesh(G('pc3',()=>new THREE.BoxGeometry(0.22,1.9,0.06)),pa);b.position.y=0.95;const h=new THREE.Group();h.rotation.z=i*Math.PI*2/3;h.add(b);cauda.add(h);}
  // trem fixo (triciclo) + calço de cauda
  for(const z of[-0.3,0.3])cil(0.3,0.3,0.22,borr,6.1,0.32,z,g,12).rotation.x=Math.PI/2;box(0.15,0.5,0.15,pre,6.1,0.6,0,g);
  for(const z of[-1,1]){const st=box(0.18,1.6,0.18,pre,-0.9,1.0,z*1.55,g);st.rotation.x=z*0.55;const st2=box(0.14,1.2,0.14,pre,-0.9,0.9,z*1.6,g);st2.rotation.x=-z*0.3;cil(0.48,0.48,0.34,borr,-0.9,0.48,z*1.95,g,14).rotation.x=Math.PI/2;}
  box(0.12,0.9,0.12,pre,-10.6,2.3,0,g);
  // FAB: cocar no cone de cauda e bandeira na deriva
  for(const z of[-1,1]){const c=new THREE.Group();c.position.set(-3.7,2.4,z*1.13);c.rotation.y=z>0?0:Math.PI;g.add(c);
    [['#1e8a3c',0.55],['#f2c230',0.39],['#1f4fa8',0.25],['#ffffff',0.08]].forEach(([k,r],i)=>{const d=new THREE.Mesh(new THREE.CircleGeometry(r,20),M(k,0.6));d.position.z=0.01+i*0.005;c.add(d);});
    const f=new THREE.Group();f.position.set(-11.5,4.7,z*0.14);f.rotation.z=-0.45;g.add(f);box(0.45,1.2,0.02,M('#1e8a3c',0.6),-0.22,0,0,f);box(0.45,1.2,0.02,M('#f2c230',0.6),0.23,0,0,f);}
  g.userData={rotor,cauda,disco,portas,torre:tor};return g;}

// ---------- (19/11) AH-2 Sabre a partir do modelo 3D baixado (Mi-35M de 42manako, CC-BY-4.0), pintado de FAB
let MI=null;
function miGeo(){if(MI)return MI;const d=window.MI35,b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const p=new Int16Array(b64(d.pos).buffer),nn=new Int8Array(b64(d.nor).buffer),ix=d.i32?new Uint32Array(b64(d.idx).buffer):new Uint16Array(b64(d.idx).buffer),pt=b64(d.parte);
  const pos=new Float32Array(p.length),nor=new Float32Array(nn.length);for(let i=0;i<p.length;i++){pos[i]=p[i]/1000;nor[i]=nn[i]/127;}
  const pa=new THREE.BufferAttribute(pos,3),na=new THREE.BufferAttribute(nor,3),L=[[],[],[],[],[],[],[]];for(let t=0;t<ix.length;t+=3)L[pt[ix[t]]].push(ix[t],ix[t+1],ix[t+2]);
  MI=L.map(l=>{const g=new THREE.BufferGeometry();g.setAttribute('position',pa);g.setAttribute('normal',na);g.setIndex(l);return g;});return MI;}
function criarSabre3D(pint){const g=new THREE.Group(),G_=miGeo(),d=window.MI35,cor=pint.camo?matCamo(...pint.camo):M(pint.cor,0.75);
  const vid=new THREE.MeshStandardMaterial({color:0x5d7a8c,roughness:0.05,metalness:0.5,transparent:true,opacity:0.65,side:THREE.DoubleSide});
  const mt=[cor,vid,M('#3a4136',0.6),M('#22262a',0.9)];for(let i=0;i<4;i++){const m=new THREE.Mesh(G_[i],mt[i]);if(i===0)m.name='fus';g.add(m);}g.add(new THREE.Mesh(G_[6],M('#141414',0.9)));
  const pa=new THREE.MeshStandardMaterial({color:0x2a2e30,roughness:0.6,side:THREE.DoubleSide});
  const rotor=new THREE.Group();rotor.position.fromArray(d.rotor);g.add(rotor);const mr=new THREE.Mesh(G_[4],pa);mr.position.fromArray(d.rotor).negate();rotor.add(mr);
  const cauda=new THREE.Group();cauda.position.fromArray(d.cauda);g.add(cauda);const mc=new THREE.Mesh(G_[5],pa);mc.position.fromArray(d.cauda).negate();cauda.add(mc);
  const disco=new THREE.Mesh(new THREE.CircleGeometry(8.6,40),new THREE.MeshBasicMaterial({color:0x222222,transparent:true,opacity:0.1,depthWrite:false,side:THREE.DoubleSide}));disco.rotation.x=-Math.PI/2;disco.visible=false;rotor.add(disco);
  // marcas da FAB coladas na superfície (raio de fora p/ dentro acha o casco e a normal)
  const fus=g.children[0],rc=new THREE.Raycaster(),cola=(x,y,z,obj)=>{rc.set(new THREE.Vector3(x,y,z*6),new THREE.Vector3(0,0,-Math.sign(z)));const h=rc.intersectObject(fus)[0];if(!h)return;
    obj.position.copy(h.point).addScaledVector(h.face.normal,0.03);obj.lookAt(_o.copy(h.point).add(h.face.normal));g.add(obj);};
  for(const z of[-1,1]){const c=new THREE.Group();[['#1e8a3c',0.6],['#f2c230',0.43],['#1f4fa8',0.27],['#ffffff',0.09]].forEach(([k,r],i)=>{const dd=new THREE.Mesh(new THREE.CircleGeometry(r,24),M(k,0.6));dd.position.z=i*0.006;c.add(dd);});cola(-4.6,2.6,z,c);
    const f=new THREE.Group();box(0.5,0.9,0.01,M('#1e8a3c',0.6),-0.25,0,0,f);box(0.5,0.9,0.01,M('#f2c230',0.6),0.25,0,0,f);cola(-12.2,4.2,z,f);}
  cabineInterior(g);g.userData={rotor,cauda,disco,portas:[],eixoCauda:'z'};return g;}
const _o=new THREE.Vector3();
// (19/11) interior das 2 cabines (o modelo baixado só tem o vidro): painel com telas, mostradores, consoles laterais, manche, assento; atirador com a mira periscópica
function telaTex(tipo){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#04140a';x.fillRect(0,0,128,128);x.strokeStyle='#5dff8a';x.fillStyle='#5dff8a';x.lineWidth=2;x.font='12px monospace';
  if(tipo==='mapa'){for(let i=0;i<9;i++){x.globalAlpha=0.35;x.beginPath();x.moveTo(0,i*16);x.lineTo(128,i*16+20);x.stroke();}x.globalAlpha=1;x.beginPath();x.moveTo(64,52);x.lineTo(58,70);x.lineTo(70,70);x.closePath();x.fill();x.fillText('N',60,14);x.fillStyle='#ff5a4a';x.fillRect(90,30,6,6);x.fillRect(30,90,6,6);}
  else if(tipo==='hor'){x.fillStyle='#173a5c';x.fillRect(0,0,128,64);x.fillStyle='#4a3218';x.fillRect(0,64,128,64);x.strokeStyle='#fff';x.beginPath();x.moveTo(30,64);x.lineTo(98,64);x.stroke();x.beginPath();x.moveTo(44,64);x.lineTo(56,72);x.lineTo(72,72);x.lineTo(84,64);x.stroke();x.fillStyle='#fff';x.fillText('ALT 50',4,120);x.fillText('120',96,120);}
  else{x.beginPath();x.arc(64,64,40,0,7);x.stroke();x.beginPath();x.moveTo(64,20);x.lineTo(64,108);x.moveTo(20,64);x.lineTo(108,64);x.stroke();x.fillText('TV 10x',38,122);x.strokeRect(54,54,20,20);}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
function cabineInterior(g){const pr=M('#1b1f22',0.85),cz=M('#3b4247',0.8),ass=M('#2a2f24',0.95),tela=t=>new THREE.MeshBasicMaterial({map:telaTex(t)});
  const relogio=(x,y,z,pai)=>{const m=new THREE.Mesh(G('rel',()=>new THREE.CircleGeometry(0.045,16)),new THREE.MeshBasicMaterial({color:0x8e9086}));m.position.set(x,y,z);m.rotation.y=Math.PI/2;pai.add(m);};
  // piloto (atrás, em cima): olho ~ (3.55, 2.62)
  const P=new THREE.Group();P.position.set(4.3,2.12,0);P.rotation.z=-0.55;g.add(P);box(0.08,0.36,1.0,pr,0,0,0,P);box(0.12,0.04,1.0,pr,0.02,0.2,0,P);
  for(const [z,t] of[[-0.27,'mapa'],[0.0,'hor'],[0.27,'mapa']]){const m=new THREE.Mesh(G('tela',()=>new THREE.PlaneGeometry(0.22,0.22)),tela(t));m.position.set(-0.045,0.0,z);m.rotation.y=-Math.PI/2;P.add(m);}
  for(const z of[-0.44,0.44])for(const y of[-0.1,0.08])relogio(-0.045,y,z,P);
  for(const z of[-1,1])box(0.9,0.2,0.22,cz,3.7,1.95,z*0.42,g);cil(0.02,0.02,0.45,pr,3.75,2.1,0,g,6).rotation.z=-0.2;esf(0.04,pr,3.82,2.32,0,g);   // consoles + manche
  box(0.15,0.8,0.6,ass,3.05,2.4,0,g);box(0.55,0.12,0.55,ass,3.3,2.0,0,g);

  const A=new THREE.Group();A.position.set(6.12,1.74,0);A.rotation.z=-0.6;g.add(A);box(0.08,0.3,0.7,pr,0,0,0,A);
  const mi=new THREE.Mesh(G('tela2',()=>new THREE.PlaneGeometry(0.24,0.24)),tela('mira'));mi.position.set(-0.045,0.02,-0.15);mi.rotation.y=-Math.PI/2;A.add(mi);
  for(const z of[0.1,0.24])relogio(-0.045,0.05,z,A);   // mira periscópica

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;document.body.appendChild(R.domElement);

const PINT=[

const MOD=[
  {id:'sabre3d',nome:'🇧🇷 Sabre (modelo 3D)',f:criarSabre3D,txt:'Modelo 3D baixado (Mi-35M de 42manako, CC-BY-4.0), sem as marcas russas: pintado com a camuflagem escolhida, cocar da FAB e bandeira na deriva. ~37 mil triângulos.'},

let mod=MOD[0],pint=PINT[0],heli=null,porta=false,gira=true;
function monta(){if(heli)cena.remove(heli);heli=mod.id==='atual'?criarAtual(pint.cor||pint.camo[0]):mod.f(pint);heli.traverse(m=>{if(m.isMesh){m.castShadow=true;}});cena.add(heli);

{const l=document.getElementById('lX');X.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it.nome;if(i===1)b.classList.add('on');l.appendChild(b);

// vista de dentro: câmera no olho do tripulante, olhando p/ frente; arrastar = virar a cabeça (gira em volta de um ponto 5 cm à frente)
function cabine(x,y,baixo=0.16){if(mod.id!=='sabre3d'){mod=MOD[0];monta();}dentro=true;heli.traverse(m=>{if(m.isMesh&&m.material.side!==THREE.DoubleSide){m.material.side=THREE.DoubleSide;m.material.needsUpdate=true;}});
